<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1018'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%234fc4a8' stroke-width='2.5'/%3E%3Cpath d='M16 4v3M16 25v3M4 16h3M25 16h3' stroke='%23f0a04b' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #07080d;
    --bg2:        #0e1018;
    --bg3:        #161822;
    --border:     #1f2230;
    --border2:    #2a2d42;
    --accent:     #e8615a;
    --accent2:    #f0a04b;
    --teal:       #4fc4a8;
    --text:       #d4d6e8;
    --text-dim:   #8088a8;
    --text-dimmer:#4a4f6a;
    --mono:   'DM Mono', monospace;
    --sans:   'Noto Sans JP', sans-serif;
    --display:'Syne', sans-serif;
  }

  [data-theme="light"] {
    --bg:         #dde0ec;
    --bg2:        #eceef8;
    --bg3:        #d4d8ea;
    --border:     #b8bcd4;
    --border2:    #9aa0be;
    --accent:     #c43c36;
    --accent2:    #9e5e08;
    --teal:       #1e9070;
    --text:       #0e1020;
    --text-dim:   #4a5070;
    --text-dimmer:#8088a8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
  html, body { transition: background-color 0.25s; }

  /* Atmospheric glow (becomes a readability scrim when a custom bg is set) */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(79,196,168,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 100%, rgba(232,97,90,0.05) 0%, transparent 55%);
    pointer-events: none; z-index: 0;
  }
  [data-theme="light"] body::before {
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(30,144,112,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 100%, rgba(196,60,54,0.04) 0%, transparent 55%);
  }
  .has-bg body::before { background: linear-gradient(rgba(7,8,13,0.5), rgba(7,8,13,0.64)); }
  [data-theme="light"].has-bg body::before { background: linear-gradient(rgba(220,224,236,0.4), rgba(220,224,236,0.58)); }

  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 28px 24px 60px;
  }

  /* ── Top controls ── */
  .top-controls {
    position: fixed; top: 18px; right: 20px;
    display: flex; gap: 8px; z-index: 50;
  }
  .icon-btn {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text-dim); cursor: pointer;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-dimmer); }

  /* ── Center stack ── */
  .center {
    width: 100%; max-width: 880px;
    margin: auto 0;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 6vh;
  }

  .greeting {
    font-family: var(--display); font-weight: 600;
    font-size: 17px; letter-spacing: 0.01em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .greeting b { color: var(--accent2); font-weight: 700; }

  .clock {
    font-family: var(--mono); font-weight: 500;
    font-size: clamp(52px, 10.5vw, 92px);
    line-height: 1; letter-spacing: 0.01em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .clock .sec { color: var(--teal); font-size: 0.38em; vertical-align: super; margin-left: 5px; font-weight: 400; }

  .date {
    font-family: var(--mono); font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-dim); margin-top: 10px;
  }

  /* ── Search ── */
  .search {
    display: flex; align-items: center;
    width: 100%; max-width: 560px;
    margin-top: 34px;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 4px 4px 4px 6px;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .search:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(79,196,168,0.1); }

  .search-engine {
    background: transparent; border: none; outline: none;
    color: var(--text-dim); font-family: var(--mono); font-size: 11px;
    padding: 8px 6px; cursor: pointer; border-radius: 8px;
  }
  .search-engine option { background: var(--bg3); color: var(--text); }

  .search-input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 15px;
    padding: 10px 8px;
  }
  .search-input::placeholder { color: var(--text-dimmer); }

  .search-go {
    background: var(--teal); border: none; border-radius: 8px;
    width: 38px; height: 38px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #07080d; transition: filter 0.15s;
  }
  .search-go:hover { filter: brightness(1.1); }

  /* ── Tiles ── */
  .tiles {
    margin-top: 40px;
    width: 100%;
    display: flex; flex-direction: column;
    gap: 22px;
  }
  .tile-section { display: flex; flex-direction: column; gap: 10px; }
  .tile-section-title {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-dim);
    padding-left: 4px;
  }
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(98px, 1fr));
    gap: 14px;
    justify-content: center;
  }

  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 16px 8px 13px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none; color: var(--text);
    cursor: pointer;
    transition: transform 0.14s, border-color 0.14s, background 0.14s;
    position: relative;
    animation: pop 0.2s ease backwards;
  }
  .tile:hover {
    transform: translateY(-3px);
    border-color: var(--border2);
    background: var(--bg3);
  }

  .tile-icon {
    width: 44px; height: 44px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    font-family: var(--display); font-weight: 800; font-size: 20px; color: #fff;
    flex-shrink: 0;
  }
  .tile-icon img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #fff;
  }
  .tile-name {
    font-size: 12px; color: var(--text-dim);
    text-align: center; line-height: 1.25;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    width: 100%;
  }
  .tile:hover .tile-name { color: var(--text); }

  .tile-add {
    border-style: dashed;
    color: var(--text-dimmer);
    justify-content: center;
  }
  .tile-add:hover { border-color: var(--teal); color: var(--teal); background: var(--bg2); }
  .tile-add .plus {
    width: 44px; height: 44px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 300;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; animation: fade 0.15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 16px;
    width: 100%; max-width: 380px;
    max-height: calc(100vh - 40px); overflow-y: auto;
    padding: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    animation: rise 0.18s ease;
  }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-title { font-family: var(--display); font-size: 16px; font-weight: 700; color: var(--text); }
  .modal-close {
    background: none; border: none; cursor: pointer; color: var(--text-dimmer);
    font-size: 18px; line-height: 1; padding: 2px 4px; transition: color 0.15s;
  }
  .modal-close:hover { color: var(--accent); }

  .field { margin-bottom: 13px; }
  .field label {
    display: block; font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: 8px;
    color: var(--text); font-family: var(--sans); font-size: 14px;
    padding: 9px 11px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--teal); box-shadow: 0 0 0 2px rgba(79,196,168,0.12);
  }
  .field select option { background: var(--bg3); }

  /* Icon editor */
  .icon-edit { display: flex; gap: 11px; align-items: center; }
  .icon-preview {
    width: 46px; height: 46px; border-radius: 11px; flex-shrink: 0;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 800; font-size: 20px; color: #fff;
  }
  .icon-preview img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #fff;
  }
  .icon-edit-controls { display: flex; gap: 6px; flex: 1; }
  .icon-edit-controls .btn { flex: 1; text-align: center; padding: 9px 4px; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; cursor: pointer;
  }
  .toggle-row span { font-size: 13px; color: var(--text); }
  .toggle {
    width: 38px; height: 22px; border-radius: 11px; flex-shrink: 0;
    background: var(--border2); position: relative; transition: background 0.18s;
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    transition: transform 0.18s;
  }
  .toggle.on { background: var(--teal); }
  .toggle.on::after { transform: translateX(16px); }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn {
    border-radius: 8px; cursor: pointer; font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.06em; padding: 9px 16px;
    transition: background 0.15s, color 0.15s, border-color 0.15s, filter 0.15s;
  }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text-dim); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dimmer); }
  .btn-primary { background: var(--teal); border: 1px solid var(--teal); color: #07080d; font-weight: 500; }
  .btn-primary:hover { filter: brightness(1.1); }

  .settings-section { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; }
  .settings-section-title {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dimmer); margin-bottom: 8px;
  }
  .io-row { display: flex; gap: 8px; }
  .io-row .btn { flex: 1; text-align: center; }

  /* Feed list manager */
  .feed-list-label {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
  }
  #feed-count { color: var(--text-dimmer); }
  .feed-list {
    max-height: 132px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;
  }
  .feed-row {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 7px; padding: 6px 8px;
  }
  .feed-row[draggable]        { cursor: grab; }
  .feed-row[draggable]:active { cursor: grabbing; }
  .feed-row span {
    flex: 1; min-width: 0; font-size: 11px; color: var(--text-dim);
    font-family: var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .feed-row button {
    background: none; border: none; cursor: pointer; flex-shrink: 0;
    color: var(--text-dimmer); font-size: 14px; line-height: 1; padding: 0 2px;
    transition: color 0.12s;
  }
  .feed-row button:hover { color: var(--accent); }
  .feed-empty {
    font-family: var(--mono); font-size: 11px; color: var(--text-dimmer);
    padding: 6px 2px;
  }
  .feed-add-row { display: flex; gap: 6px; }
  .feed-add-row input {
    flex: 1; min-width: 0; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: 8px;
    color: var(--text); font-family: var(--sans); font-size: 13px;
    padding: 9px 11px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .feed-add-row input:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(79,196,168,0.12); }
  .feed-add-row .btn { flex-shrink: 0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .feed-add-row input:disabled { opacity: 0.45; cursor: not-allowed; }
  input[type="file"] { display: none; }
  .file-label { display: inline-flex; align-items: center; justify-content: center; }

  /* ── Context menu ── */
  #ctx-menu {
    position: fixed; z-index: 200;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 9px; padding: 4px; min-width: 140px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.5);
    display: none;
  }
  #ctx-menu.open { display: block; animation: rise 0.1s ease; }
  .ctx-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--text); transition: background 0.1s;
  }
  .ctx-item:hover { background: var(--bg2); }
  .ctx-item.danger { color: var(--accent); }
  .ctx-item.danger:hover { background: rgba(232,97,90,0.1); }
  .ctx-divider { height: 1px; background: var(--border); margin: 3px 4px; }

  .hint {
    margin-top: 30px; font-family: var(--mono); font-size: 10px;
    color: var(--text-dimmer); letter-spacing: 0.05em; text-align: center;
  }

  /* ── Side widgets (RSS, Note) — shared positioning ── */
  .widget {
    position: fixed; width: 290px; max-height: 70vh; z-index: 30;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    display: none; flex-direction: column;
  }
  .widget.show { display: flex; }
  .widget.pos-tl { top: 18px;    left: 18px;  }
  .widget.pos-ml { top: 50%;     left: 18px;  transform: translateY(-50%); }
  .widget.pos-bl { bottom: 30px; left: 18px;  }
  .widget.pos-tr { top: 64px;    right: 18px; }
  .widget.pos-mr { top: 50%;     right: 18px; transform: translateY(-50%); }
  .widget.pos-br { bottom: 30px; right: 18px; }
  /* Hide widgets when there isn't room beside the centred column */
  @media (max-width: 1280px) { .widget.show { display: none; } }

  /* RSS panel specifics */
  .rss-panel { padding: 14px 14px 12px; }

  .rss-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 10px;
  }
  .rss-refresh {
    background: none; border: none; cursor: pointer;
    color: var(--text-dimmer); padding: 2px; line-height: 0;
    transition: color 0.15s, transform 0.6s;
  }
  .rss-refresh:hover { color: var(--text); }
  .rss-refresh.spin { transform: rotate(360deg); }
  .rss-list { overflow-y: auto; flex: 1; margin: -4px; padding: 4px; }
  .rss-item {
    display: block; padding: 8px 9px; border-radius: 7px;
    text-decoration: none; color: var(--text-dim);
    font-size: 12.5px; line-height: 1.4;
    transition: background 0.12s, color 0.12s;
    word-break: break-word;
  }
  .rss-item:hover { background: var(--bg3); color: var(--text); }
  .rss-item + .rss-item { margin-top: 1px; }
  .rss-state {
    padding: 14px 4px; font-size: 11px; color: var(--text-dimmer);
    text-align: center; font-family: var(--mono); letter-spacing: 0.05em;
  }

  /* ── Sticky note widget ── */
  .note-panel { padding: 14px; }
  .note-head {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 10px;
  }
  .note-text {
    flex: 1; width: 100%; min-height: 220px;
    background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font-family: var(--sans); font-size: 13px;
    line-height: 1.55; padding: 0;
  }
  .note-text::placeholder { color: var(--text-dimmer); }
</style>
</head>
<body>
<div class="page">

  <div class="top-controls">
    <button class="icon-btn" id="btn-settings" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="Toggle theme">
      <svg id="theme-icon" width="15" height="15" viewBox="0 0 15 15" fill="none"></svg>
    </button>
  </div>

  <main class="center">
    <div class="greeting" id="greeting"></div>
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>

    <form class="search" id="search-form">
      <select class="search-engine" id="search-engine" title="Search engine"></select>
      <input class="search-input" id="search-input" type="text" placeholder="Search the web…" data-i18n-ph="searchPlaceholder" autocomplete="off" spellcheck="false">
      <button class="search-go" type="submit" title="Search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </form>

    <div class="tiles" id="tiles"></div>

    <div class="hint" data-i18n="hint">right-click a tile to edit or remove · drag to reorder</div>
  </main>
</div>

<!-- RSS feed panel -->
<aside class="widget rss-panel" id="rss-panel">
  <div class="rss-head">
    <span data-i18n="feed">Feed</span>
    <button class="rss-refresh" id="rss-refresh" title="Refresh">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
  <div class="rss-list" id="rss-list"></div>
</aside>

<!-- Sticky note widget -->
<aside class="widget note-panel" id="note-panel">

// ── Storage ───────────────────────────────────────────────────────────────────
function normalizeLink(l) {
  if (typeof l.id !== 'number') return null;
  return {
    id:    l.id,
    name:  typeof l.name  === 'string' ? l.name  : '',
    url:   typeof l.url   === 'string' ? l.url   : '',
    icon:  typeof l.icon  === 'string' ? l.icon  : '',
    group: typeof l.group === 'string' ? l.group : '',
  };
}
function normalizeRss(r) {
  r = r || {};
  let urls = Array.isArray(r.urls)
    ? r.urls.filter(u => typeof u === 'string' && u.trim()).map(u => u.trim())
    : [];
  if (!urls.length && typeof r.url === 'string' && r.url.trim()) urls = [r.url.trim()];
  return {
    enabled:  !!r.enabled,
    urls:     urls.slice(0, MAX_FEEDS),
    position: ALL_POSITIONS.includes(r.position) ? r.position : 'mr',
  };
}
function normalizeNote(n) {
  n = n || {};
  return {
    enabled:  !!n.enabled,
    position: ALL_POSITIONS.includes(n.position) ? n.position : 'ml',
    text:     typeof n.text === 'string' ? n.text : '',
  };
}
function normalizeGroups(g) {
  if (!Array.isArray(g)) return [];
  // Keep only non-empty strings, dedupe preserving order, cap at MAX_GROUPS
  const seen = new Set();
  const out  = [];
  for (const v of g) {
    if (typeof v !== 'string') continue;
    const name = v.trim();
    if (!name || seen.has(name)) continue;
    seen.add(name);
    out.push(name);
    if (out.length >= MAX_GROUPS) break;
  }
  return out;
}
function safeNextId(stored) {
  const maxId = links.reduce((m, l) => Math.max(m, l.id), 0);
  return Math.max(Number(stored) || 0, maxId + 1);
}
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch {}
  if (data && Array.isArray(data.links)) {
    links    = data.links.map(normalizeLink).filter(Boolean);
    nextId   = safeNextId(data.nextId);
    settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
    settings.rss    = normalizeRss(settings.rss);
    settings.note   = normalizeNote(settings.note);
    settings.groups = normalizeGroups(settings.groups);
    ensureWidgetSides('rss');  // resolve any conflicting positions from imported/old data
  } else {
    links  = DEFAULT_LINKS.map((l, i) => ({ id: i + 1, name: l.name, url: l.url, icon: '', group: '' }));
    nextId = links.length + 1;
  }
}
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ links, nextId, settings }));
    return true;
  } catch { return false; }
}

// ── Image helper — downscale to keep localStorage small ───────────────────────
function processImageFile(file, maxDim, mime, quality, cb) {
  if (!file || !file.type.startsWith('image/')) { cb(null); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const r = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL(mime, quality)); } catch { cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = e.target.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function withProtocol(url) { return /^https?:\/\//i.test(url) ? url : 'https://' + url; }
function faviconSources(url) {
  let host = '';
  try { host = new URL(withProtocol(url)).hostname; } catch { return []; }
  if (!host) return [];
  return [
    `https://icons.duckduckgo.com/ip3/${host}.ico`,      // real site favicon, fails cleanly when absent
    `https://www.google.com/s2/favicons?domain=${host}&sz=64`, // broad fallback
  ];
}
// Advance an <img> through its remaining favicon sources; hide it (revealing the letter) when exhausted
function nextIcon(img) {
  const list = img.dataset.fb ? img.dataset.fb.split('|').filter(Boolean) : [];
  if (list.length) {
    img.dataset.fb = list.slice(1).join('|');
    img.src = list[0];
  } else {
    img.style.display = 'none';
  }
}
function colorFor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return `hsl(${Math.abs(h) % 360}, 42%, 46%)`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Background ────────────────────────────────────────────────────────────────
function applyBackground() {
  if (settings.background) {
    document.body.style.backgroundImage = `url("${settings.background.replace(/"/g,'%22')}")`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
    document.documentElement.classList.add('has-bg');
  } else {
    document.body.style.backgroundImage = '';
    document.documentElement.classList.remove('has-bg');
  }
}
function setBackground(value) {
  const prev = settings.background;
  settings.background = value;
  if (!save()) {
    settings.background = prev; save();
    alert(L().alertImageTooLarge);
    return false;
  }
  applyBackground();
  return true;
}
function resetBackground() {
  setBackground('');
  $.setBgUrl.value = '';
}

// ── Render tiles ──────────────────────────────────────────────────────────────
function buildTileHtml(l, i) {
  const letter  = (l.name.trim()[0] || '?').toUpperCase();
  const sources = l.icon === FORCE_LETTER ? []
                : l.icon ? [l.icon, ...faviconSources(l.url)]
                : faviconSources(l.url);
  const target  = settings.newTab ? ' target="_blank" rel="noopener"' : '';
  const imgTag  = sources.length
    ? `<img src="${esc(sources[0])}" data-fb="${esc(sources.slice(1).join('|'))}" alt="" onerror="nextIcon(this)">`
    : '';
  return `<a class="tile" href="${esc(withProtocol(l.url))}"${target}
      style="animation-delay:${Math.min(i, 30) * 20}ms"
      draggable="true" data-id="${l.id}"
      oncontextmenu="openCtx(event, ${l.id})">
    <div class="tile-icon" style="background:${colorFor(l.name)}">
      <span>${esc(letter)}</span>
      ${imgTag}
    </div>
    <span class="tile-name">${esc(l.name)}</span>
  </a>`;
}

function renderTiles() {
  // Group links by their .group field (links pointing at a deleted group fall to ungrouped)
  const byGroup = new Map();
  byGroup.set('', []);                          // ungrouped bucket always exists
  for (const g of settings.groups) byGroup.set(g, []);
  for (const l of links) {
    const g = settings.groups.includes(l.group) ? l.group : '';
    byGroup.get(g).push(l);
  }

  let html = '';
  let idx = 0;  // global tile index so the staggered entry animation is monotonic
  const order = [...settings.groups, ''];  // user-defined groups first, ungrouped last
  for (const groupName of order) {
    const groupLinks = byGroup.get(groupName) || [];
    const isUngrouped = groupName === '';
    const showAddHere = isUngrouped && !settings.hideAdd;
    if (!groupLinks.length && !showAddHere) continue;  // hide empty sections
    html += '<div class="tile-section">';
    if (groupName) html += `<div class="tile-section-title">${esc(groupName)}</div>`;
    html += '<div class="tile-grid">';
    for (const l of groupLinks) html += buildTileHtml(l, idx++);
    if (showAddHere) {
      html += `<button class="tile tile-add" style="animation-delay:${Math.min(idx++, 30) * 20}ms" onclick="openLinkModal()">
        <div class="plus">+</div>
        <span class="tile-name">${esc(L().add)}</span>
      </button>`;
    }
    html += '</div></div>';
  }
  $.tiles.innerHTML = html;
  attachDrag();
}
// Hint text is tied to the Add tile — hide both together
function applyHint() {
  $.hint.style.display = settings.hideAdd ? 'none' : '';
}

// ── Drag to reorder ───────────────────────────────────────────────────────────
let dragId = null;
function attachDrag() {
  $.tiles.querySelectorAll('.tile[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragId = Number(el.dataset.id);
      el.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.style.opacity = ''; dragId = null; });
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = Number(el.dataset.id);
      if (dragId === null || dragId === targetId) return;
      const from = links.findIndex(l => l.id === dragId);
      const to   = links.findIndex(l => l.id === targetId);
      if (from < 0 || to < 0) return;
      // Adopt the target tile's group (no-op for same-group reorders)
      links[from].group = links[to].group;
      const [moved] = links.splice(from, 1);
      links.splice(to, 0, moved);
      save(); renderTiles();
    });
  });
}

// ── Context menu ──────────────────────────────────────────────────────────────
function openCtx(evt, id) {
  evt.preventDefault();
  ctxId = id;
  const m = $.ctxMenu;
  m.style.visibility = 'hidden';
  m.classList.add('open');
  const mw = m.offsetWidth, mh = m.offsetHeight;
  m.classList.remove('open');
  m.style.visibility = '';
  m.style.left = Math.min(evt.clientX, innerWidth  - mw - 6) + 'px';
  m.style.top  = Math.min(evt.clientY, innerHeight - mh - 6) + 'px';
  m.classList.add('open');
}
function closeCtx() { $.ctxMenu.classList.remove('open'); ctxId = null; }
function ctxEdit() {
  if (ctxId === null) return;
  const l = links.find(x => x.id === ctxId);
  if (l) openLinkModal(l);
  closeCtx();
}
function ctxRemove() {
  if (ctxId === null) return;
  const l = links.find(x => x.id === ctxId);
  closeCtx();
  if (!l) return;
  if (!confirm(L().confirmRemove.replace('{name}', l.name || ''))) return;
  links = links.filter(x => x.id !== l.id);
  save(); renderTiles();
}
document.addEventListener('click',       e => { if (!$.ctxMenu.contains(e.target)) closeCtx(); });
document.addEventListener('contextmenu', e => { if (!$.ctxMenu.contains(e.target) && !e.target.closest('.tile')) closeCtx(); });

function openLinkModal(link) {
  editingId = link ? link.id : null;
  modalIcon = link ? link.icon : '';
  $.linkTitle.textContent = link ? L().editLink : L().addLink;
  $.linkSave.textContent  = link ? L().save     : L().add;
  $.linkName.value = link ? link.name : '';
  $.linkUrl.value  = link ? link.url  : '';
  populateGroupSelect($.linkGroup, link ? link.group : '');
  // show a pasted icon URL in the field; hide data: URLs and the letter sentinel
  $.iconUrl.value  = (modalIcon && modalIcon !== FORCE_LETTER && !modalIcon.startsWith('data:')) ? modalIcon : '';
  updateIconPreview();
  $.linkModal.classList.add('open');
  setTimeout(() => $.linkName.focus(), 30);
}
function closeLinkModal() { $.linkModal.classList.remove('open'); editingId = null; modalIcon = ''; }
function updateIconPreview() {
  const nameVal = $.linkName.value.trim();
  $.iconPrevLetter.textContent = (nameVal[0] || '?').toUpperCase();
  $.iconPrev.style.background = colorFor(nameVal || '?');
  const sources = modalIcon === FORCE_LETTER ? []
    : modalIcon ? [modalIcon, ...faviconSources($.linkUrl.value.trim())]
    : faviconSources($.linkUrl.value.trim());
  if (sources.length) {
    $.iconPrevImg.dataset.fb = sources.slice(1).join('|');
    $.iconPrevImg.onerror = () => nextIcon($.iconPrevImg);
    $.iconPrevImg.style.display = 'block';
    $.iconPrevImg.src = sources[0];
  } else {
    $.iconPrevImg.style.display = 'none';
  }
}
function resetModalIcon() { modalIcon = ''; $.iconUrl.value = ''; updateIconPreview(); }
function useModalLetter() { modalIcon = FORCE_LETTER; $.iconUrl.value = ''; updateIconPreview(); }
function saveLink() {
  const name  = $.linkName.value.trim();
  const url   = $.linkUrl.value.trim();
  const group = $.linkGroup.value;
  if (!name || !url) { (!name ? $.linkName : $.linkUrl).focus(); return; }
  if (editingId !== null) {
    const l = links.find(x => x.id === editingId);
    if (l) { l.name = name; l.url = url; l.icon = modalIcon; l.group = group; }
  } else {
    links.push({ id: nextId++, name, url, icon: modalIcon, group });
  }
  if (!save()) { alert(L().alertSaveFailed); return; }
  renderTiles(); closeLinkModal();
}
$.iconUrl.addEventListener('input', () => { modalIcon = $.iconUrl.value.trim(); updateIconPreview(); });
$.linkUrl.addEventListener('input',  () => { if (!modalIcon || !modalIcon.startsWith('data:')) updateIconPreview(); });
$.linkName.addEventListener('input', updateIconPreview);

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (!Array.isArray(d.links)) throw 0;
      links    = d.links.map(normalizeLink).filter(Boolean);
      nextId   = safeNextId(d.nextId);

      settings.rss    = normalizeRss(settings.rss);
      settings.note   = normalizeNote(settings.note);

// ── RSS feed ──────────────────────────────────────────────────────────────────
const RSS_REFRESH_MS = 15 * 60 * 1000;  // 15 min
const RSS_MAX_ITEMS  = 10;
let rssTimer = null;
let rssLastSig = '';     // signature of the URL set last fetched (avoids needless refetch)

// ── Side constraint ──────────────────────────────────────────────────────────
// Only one widget allowed per side. When the user changes one widget's enabled
// state or position, if it now shares a side with the OTHER enabled widget,
// the other one auto-moves to its mirror position on the opposite side.
const POSITION_MIRROR = { tl:'tr', ml:'mr', bl:'br', tr:'tl', mr:'ml', br:'bl' };
function sideOf(pos) { return ['tl','ml','bl'].includes(pos) ? 'l' : 'r'; }
function ensureWidgetSides(touched /* 'rss' or 'note' */) {
  const just  = settings[touched];
  const other = settings[touched === 'rss' ? 'note' : 'rss'];
  if (!just.enabled || !other.enabled) return;
  if (sideOf(just.position) === sideOf(other.position)) {
    other.position = POSITION_MIRROR[other.position] || 'mr';
  }
}

// ── Sticky note widget ───────────────────────────────────────────────────────
let noteSaveTimer = null;
function applyNote() {
  const n = settings.note;
  ALL_POSITIONS.forEach(p => $.notePanel.classList.remove('pos-' + p));
  $.notePanel.classList.add('pos-' + (ALL_POSITIONS.includes(n.position) ? n.position : 'ml'));
  $.notePanel.classList.toggle('show', n.enabled);
  if ($.noteText.value !== n.text) $.noteText.value = n.text;
}
$.noteText.addEventListener('input', () => {
  settings.note.text = $.noteText.value;
  // Debounce so we don't hit localStorage on every keystroke
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(save, 300);
});

function applyRss() {
  const r = settings.rss;
  // strip any previous position class, then re-apply
  ALL_POSITIONS.forEach(p => $.rssPanel.classList.remove('pos-' + p));
  $.rssPanel.classList.add('pos-' + (ALL_POSITIONS.includes(r.position) ? r.position : 'mr'));
  if (rssTimer) { clearInterval(rssTimer); rssTimer = null; }
  if (r.enabled) {
    $.rssPanel.classList.add('show');
    if (r.urls.length) {
      const sig = r.urls.join('|');
      if (sig !== rssLastSig) fetchFeed();
      rssTimer = setInterval(fetchFeed, RSS_REFRESH_MS);
    } else {
      showRssState('feedEmpty');
    }
  } else {
    $.rssPanel.classList.remove('show');
  }
}

function showRssState(key) {
  $.rssList.innerHTML = `<div class="rss-state" data-i18n="${key}">${esc(L()[key] || '')}</div>`;
}

// Multi-source cascade — try each in order, first that returns items wins.
// Free CORS proxies are flaky (especially against rate-limited sites like
// Reddit), so we never depend on a single source.
const FEED_FETCHERS = [
  // 1) RSS2JSON: dedicated RSS-to-JSON service, the most reliable for RSS (10k req/day free)
  {
    name: 'rss2json',
    url:  u => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(u)}`,
    parse: async res => {
      const data = await res.json();
      if (!data || data.status !== 'ok' || !Array.isArray(data.items)) throw new Error('bad rss2json');
      return data.items
        .map(i => ({ title: (i.title || '').trim(), link: (i.link || '').trim(), ts: Date.parse(i.pubDate || '') || 0 }))
        .filter(it => it.title && it.link);
    },
  },
  // 2) AllOrigins: generic CORS proxy returning JSON-wrapped raw content
  {
    name: 'allorigins',
    url:  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
    parse: async res => {
      const data = await res.json();
      if (!data || !data.contents) throw new Error('empty allorigins');
      return parseFeedXml(data.contents);
    },
  },
  // 3) corsproxy.io: streams raw response directly (no JSON wrapping)
  {
    name: 'corsproxy',
    url:  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    parse: async res => {
      const text = await res.text();
      if (!text) throw new Error('empty corsproxy');
      return parseFeedXml(text);
    },
  },
];

// Fetch a single feed through the cascade; returns [] if every source fails
async function fetchOneFeed(url) {
  for (const f of FEED_FETCHERS) {
    try {
      const res = await fetch(f.url(url));
      if (!res.ok) continue;
      const items = await f.parse(res);
      if (items.length) return items;
    } catch { /* try next source */ }
  }
  return [];
}

// Fetch every configured feed, combine, sort newest-first, show the last 10 overall
async function fetchFeed() {
  const urls = settings.rss.urls;
  if (!urls.length) { showRssState('feedEmpty'); return; }
  const sig = urls.join('|');
  rssLastSig = sig;
  showRssState('feedLoading');
  const results = await Promise.all(urls.map(fetchOneFeed));
  if (settings.rss.urls.join('|') !== sig) return;  // feed set changed mid-flight, abandon
  // Merge all items, deduping by link (handles cross-posts + accidental duplicate URLs)
  const seen = new Set();
  const all  = [];
  results.forEach(items => items.forEach(it => {
    if (!seen.has(it.link)) { seen.add(it.link); all.push(it); }
  }));
  if (!all.length) { showRssState('feedError'); return; }
  all.sort((a, b) => (b.ts || 0) - (a.ts || 0));   // newest first; undated items fall to the end
  renderFeed(all.slice(0, RSS_MAX_ITEMS));
}

function parseFeedXml(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) return [];
  const out = [];
  // RSS 2.0 / 1.0
  doc.querySelectorAll('item').forEach(node => {
    const title = (node.querySelector('title')?.textContent || '').trim();
    const link  = (node.querySelector('link')?.textContent  || '').trim();
    const date  = node.querySelector('pubDate')?.textContent || '';
    if (title && link) out.push({ title, link, ts: Date.parse(date) || 0 });
  });
  // Atom — only fall back to entries if no RSS items were found
  if (!out.length) {
    doc.querySelectorAll('entry').forEach(node => {
      const title  = (node.querySelector('title')?.textContent || '').trim();
      const links  = Array.from(node.querySelectorAll('link'));
      const altLnk = links.find(l => (l.getAttribute('rel') || 'alternate') === 'alternate') || links[0];
      const link   = altLnk ? altLnk.getAttribute('href') : '';
      const date   = node.querySelector('updated')?.textContent || node.querySelector('published')?.textContent || '';
      if (title && link) out.push({ title, link, ts: Date.parse(date) || 0 });
    });
  }
  return out;
}

function renderFeed(items) {
  const target = settings.newTab ? ' target="_blank" rel="noopener"' : '';
  $.rssList.innerHTML = items.map(it =>
    `<a class="rss-item" href="${esc(it.link)}"${target}>${esc(it.title)}</a>`
  ).join('');
}

// ── Feed list manager (settings) ──────────────────────────────────────────────
function renderFeedList() {
  const urls = settings.rss.urls;
  $.feedCount.textContent = ` ${urls.length}/${MAX_FEEDS}`;
  if (!urls.length) {
    $.feedList.innerHTML = `<div class="feed-empty" data-i18n="noFeeds">${esc(L().noFeeds)}</div>`;
  } else {
    $.feedList.innerHTML = urls.map((u, i) =>
      `<div class="feed-row"><span title="${esc(u)}">${esc(u)}</span>` +
      `<button type="button" title="${esc(L().remove)}" onclick="removeFeed(${i})">✕</button></div>`
    ).join('');
  }
  const atLimit = urls.length >= MAX_FEEDS;
  $.setRssUrl.disabled = atLimit;
  $.feedAddBtn.disabled = atLimit;
}
function addFeed() {
  const url = $.setRssUrl.value.trim();
  if (!url || settings.rss.urls.length >= MAX_FEEDS) return;
  if (settings.rss.urls.includes(url)) { $.setRssUrl.value = ''; return; }  // already added
  settings.rss.urls.push(url);
  $.setRssUrl.value = '';
  save(); renderFeedList(); applyRss();
}
function removeFeed(i) {
  settings.rss.urls.splice(i, 1);
  save(); renderFeedList(); applyRss();
}

// ── Tile groups manager ─────────────────────────────────────────────────────
let groupDragIdx = null;
function attachGroupDrag() {
  $.groupList.querySelectorAll('.feed-row[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => {
      groupDragIdx = Number(el.dataset.idx);
      el.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend',  () => { el.style.opacity = ''; groupDragIdx = null; });
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', e => {
      e.preventDefault();
      const to = Number(el.dataset.idx);
      if (groupDragIdx === null || groupDragIdx === to) return;
      const [moved] = settings.groups.splice(groupDragIdx, 1);
      settings.groups.splice(to, 0, moved);
      save(); renderGroupList(); renderTiles();
    });
  });
}
function renderGroupList() {
  const gs = settings.groups;
  $.groupCount.textContent = ` ${gs.length}/${MAX_GROUPS}`;
  if (!gs.length) {
    $.groupList.innerHTML = `<div class="feed-empty" data-i18n="noGroups">${esc(L().noGroups)}</div>`;
  } else {
    $.groupList.innerHTML = gs.map((g, i) =>
      `<div class="feed-row" draggable="true" data-idx="${i}"><span title="${esc(g)}">${esc(g)}</span>` +
      `<button type="button" title="${esc(L().remove)}" onclick="removeGroup(${i})">✕</button></div>`
    ).join('');
    attachGroupDrag();
  }
  const atLimit = gs.length >= MAX_GROUPS;
  $.groupInput.disabled  = atLimit;
  $.groupAddBtn.disabled = atLimit;
}
function addGroup() {
  const name = $.groupInput.value.trim();
  if (!name || settings.groups.length >= MAX_GROUPS) return;
  if (settings.groups.includes(name)) { $.groupInput.value = ''; return; }  // already exists
  settings.groups.push(name);
  $.groupInput.value = '';
  save(); renderGroupList(); renderTiles();
}
function removeGroup(i) {
  const name = settings.groups[i];
  if (!name) return;
  if (!confirm(L().confirmRemoveGroup.replace('{name}', name))) return;
  settings.groups.splice(i, 1);
  // Tiles that were in this group become ungrouped
  links.forEach(l => { if (l.group === name) l.group = ''; });
  save(); renderGroupList(); renderTiles();
}
function populateGroupSelect(sel, current) {
  let html = `<option value="">${esc(L().none)}</option>`;
  for (const g of settings.groups) {
    html += `<option value="${esc(g)}">${esc(g)}</option>`;
  }
  sel.innerHTML = html;
  sel.value = settings.groups.includes(current) ? current : '';
}

// Refresh button (manual reload, with a 360° spin for feedback)
$.rssRefresh.addEventListener('click', () => {
  if (!settings.rss.urls.length) return;
  $.rssRefresh.classList.remove('spin');
  void $.rssRefresh.offsetWidth;  // restart the transition
  $.rssRefresh.classList.add('spin');
  rssLastSig = '';  // force fetch even if the URL set is unchanged
  fetchFeed();
});


const MOON = '<circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 2A5.5 5.5 0 0 0 7.5 13 5.5 5.5 0 0 1 7.5 2z" fill="currentColor"/>';
const SUN  = '<circle cx="7.5" cy="7.5" r="2.8" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 1v1.4M7.5 12.6V14M1 7.5h1.4M12.6 7.5H14M3.2 3.2l1 1M10.8 10.8l1 1M11.8 3.2l-1 1M4.2 10.8l-1 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $.themeIcon.innerHTML = theme === 'light' ? MOON : SUN;
}
function toggleTheme() {
  settings.theme = settings.theme === 'light' ? 'dark' : 'light';
  applyTheme(settings.theme);
  save();
}

// ── Clock & greeting ──────────────────────────────────────────────────────────
function greetingText() {
  const h = new Date().getHours();
  const g = L().greetings;
  if (h < 5)  return g.night;
  if (h < 12) return g.morning;
  if (h < 18) return g.afternoon;
  if (h < 22) return g.evening;
  return g.night;
}
function updateGreeting() {
  const n = settings.greetingName;
  $.greeting.innerHTML = greetingText() + (n ? `, <b>${esc(n)}</b>` : '');
}
function tick() {
  const t = L();
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  $.clock.innerHTML = settings.seconds ? `${hm}<span class="sec">${p(d.getSeconds())}</span>` : hm;
  const day = t.days[d.getDay()];
  const date = d.getDate();
  const month = t.months[d.getMonth()];
  // Danish convention: "Fredag, 23. maj"; English: "Friday, May 23"
  $.date.textContent = settings.lang === 'da'
    ? `${day}, ${date}. ${month}`
    : `${day}, ${month} ${date}`;
}

// ── Global listeners ──────────────────────────────────────────────────────────
document.getElementById('btn-theme').addEventListener('click', toggleTheme);
document.getElementById('btn-settings').addEventListener('click', openSettings);
[$.linkModal, $.setModal].forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});
$.linkName.addEventListener('keydown', e => { if (e.key === 'Enter') saveLink(); });
$.linkUrl .addEventListener('keydown', e => { if (e.key === 'Enter') saveLink(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCtx(); closeLinkModal(); closeSettings(); }
});

// ── Init ──────────────────────────────────────────────────────────────────────
load();
applyTheme(settings.theme);
applyBackground();
applyLanguage();
applyRss();
applyNote();
buildEngineSelect($.searchEng, settings.engine);
renderTiles();
applyHint();
updateGreeting();
tick();
setInterval(tick, 1000);
setInterval(updateGreeting, 60000);
window.addEventListener('load', () => $.searchIn.focus());
</script>
